[MegaTune]
signature = "Page Test ECU"
queryCommand = "Q"

[Constants]
endianness = big
nPages = 3
pageSize = 32, 24, 8
pageIdentifier = "\x01", "\x02", "\x03"
pageReadCommand = "R%i%2o%2c", "R%i%2o%2c", "R%i%2o%2c"

page = 1
low = bits, U08, 0, [0:2], "Off", "On"
low_alias = bits, U08, 0, [0:2]
high = bits, U08, 0, [4:6]
byte = scalar, U08, 1, "", 1, 0, 0, 255, 0
signed = scalar, S16, 2, "", 1, 0, -32768, 32767, 0
scaled = scalar, S16, 4, "units", 0.25, -4, -100, 100, 2
table = array, U08, 6, [2x3], { someLabel(1, 2) }, 0.5, 0, 0, 100, 1
table_alias = array, U08, 6, [6], "", 1, 0, 0, 255, 0
floating = scalar, F32, 12, "", 1, 0, 0, 100, 2
ratio = scalar, U08, 16, "", {(gain + 1) * 0.5}, 0, 0, 100, 2
gain = scalar, U08, 17, "", 1, 0, 0, 255, 0
context_value = scalar, U16, 18, "", {external + 1}, 0, 0, 100, 2
wide = scalar, U64, 20, "", 1, 0, 0, 100, 0
last = scalar, U08, nextOffset, "", 1, 0, 0, 255, 0
last_alias = bits, U08, lastOffset, [0:3]

page = 2
array = array, S16, 0, [3], "", 1, 0, -100, 100, 0
number = scalar, U32, 8, "", 1, 0, 0, 100, 0
float_array = array, F32, 12, [2], "", 1, 0, 0, 100, 1

page = 3
