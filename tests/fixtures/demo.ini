; Synthetic definition for protocol tests.
#set CAN_COMMANDS
#unset INI_VERSION_2
#if INI_VERSION_2
[MegaTune]
signature = "Test ECU"
#else
#error TunerStudio is required
#endif
#if CAN_COMMANDS
queryCommand = "r\$tsCanId\x0f\x00\x00\x00\x0a"
versionInfo = "r\$tsCanId\x0e\x00\x00\x00\x10"
#else
queryCommand = "Q"
versionInfo = "S"
#endif

[Constants]
endianness = big
nPages = 2
pageSize = 1024, 512
pageIdentifier = "\$tsCanId\x04", "\$tsCanId\x05"
pageReadCommand = "r\$tsCanId\x04%2o%2c", "r\$tsCanId\x05%2o%2c"
pageValueWrite = "w\$tsCanId\x04%2o%2c%v", "w\$tsCanId\x05%2o%2c%v"
pageChunkWrite = "w\$tsCanId\x04%2o%2c%v", "w\$tsCanId\x05%2o%2c%v"
burnCommand = "b\$tsCanId\x04", "b\$tsCanId\x05"
crc32CheckCommand = "k\$tsCanId\x04\x00\x00\x00\x04", "k\$tsCanId\x05\x00\x00\x00\x04"
tableCrcCommand = "k\$tsCanId%2i%2o%2c"
retrieveConfigError = "r\$tsCanId\x07\x04\x00\x00\xff"

[ReferenceTables]
tableWriteCommand = "w\$tsCanId%2i%2o%2c%v"

[LoggerDefinition]
loggerDef = testLog, "Test Log", csv
dataReadCommand = "r\\x00\\xf4\\x00\\x00\\x04\\x00"

[ControllerCommands]
cmdTest = "w\$tsCanId\x07\x02\x08\x00\x03\x30\x39\x01"
cmdComma = "Z,;" ; the comma and semicolon are command bytes
cmdChain = cmdTest, "b\$tsCanId\x04"

[OutputChannels]
ochBlockSize = 16
ochGetCommand = "r\$tsCanId\x07%2o%2c"

[BurstMode]
getCommand = "A"
